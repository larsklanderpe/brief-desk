<title>Brief Desk</title>

<style>
:root{
  --ground:#F3F5F7; --surface:#FFFFFF; --ink:#16202B; --muted:#5B6877; --faint:#8A96A3; --rule:#D9DFE6; --hover:#EAEFF4;
  --cyber:#2F6DB5; --ai:#7A4FD0; --work:#1D8A74;
  --ok:#2E8540; --warn:#B7791F; --bad:#C2412D; --star:#C98A0C;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F151B; --surface:#172029; --ink:#E4EAF0; --muted:#93A1B0; --faint:#6B7887; --rule:#28333E; --hover:#1E2934;
    --cyber:#6FA3E6; --ai:#A98BEA; --work:#4CC2A6; --ok:#5DBB6E; --warn:#E0A84A; --bad:#EE7A63; --star:#F0B43A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F151B; --surface:#172029; --ink:#E4EAF0; --muted:#93A1B0; --faint:#6B7887; --rule:#28333E; --hover:#1E2934;
  --cyber:#6FA3E6; --ai:#A98BEA; --work:#4CC2A6; --ok:#5DBB6E; --warn:#E0A84A; --bad:#EE7A63; --star:#F0B43A;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:20px}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyber);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
header.top h1{font:600 26px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
header.top .built{font:12px var(--mono);color:var(--muted)}

.days{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 8px 7px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:84px}
.day:hover{background:var(--hover)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .d{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .d b{color:var(--ink);font-weight:500}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:18px;height:6px;border-radius:3px;background:var(--rule)}
.pip.posted{background:var(--k)}
.pip.on_disk{background:transparent;box-shadow:inset 0 0 0 1.5px var(--k)}
.day .n{font:11px var(--mono);color:var(--muted);display:flex;gap:8px}
.day .n .w{color:var(--warn)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.status{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:grid;gap:6px;border-top:3px solid var(--k)}
.card h2{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--k);margin:0;display:flex;justify-content:space-between;gap:8px}
.card .state{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:1px 7px;border-radius:10px;border:1px solid currentColor}
.chip.posted{color:var(--ok)} .chip.on_disk{color:var(--warn)} .chip.missing{color:var(--bad)} .chip.warn{color:var(--warn)}
.card p.sig{font:15px/1.5 var(--serif);margin:2px 0 0;color:var(--ink)}
.card p.sig.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;justify-self:start}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--ground);padding-block:8px;z-index:2}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:13px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--hover);font-weight:600}
.seg .sw{width:8px;height:8px;border-radius:50%;background:var(--k)}
.filters input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 10px}
.filters select{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 8px;max-width:100%}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.count{font:12px var(--mono);color:var(--muted);margin-left:auto}

.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--k);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.item.read{opacity:.62}
.item .meta{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.item .meta .kind{color:var(--k);font-weight:500}
.item h3{font:500 18px/1.3 var(--serif);margin:0;text-wrap:balance}
.item h3 a{text-decoration:none}
.item h3 a:hover{text-decoration:underline}
.item .sum{margin:0;color:var(--ink);max-width:72ch}
.item .take{margin:0;font:italic 15px/1.5 var(--serif);color:var(--muted);max-width:72ch;padding-left:12px;border-left:2px solid var(--rule)}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.act{border:1px solid var(--rule);background:none;border-radius:5px;padding:3px 9px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.act:hover{background:var(--hover);color:var(--ink)}
.act.on{color:var(--star);border-color:var(--star)}
.act.readon{color:var(--ok);border-color:var(--ok)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--rule);border-radius:6px}

aside{display:grid;gap:16px}
aside section{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;display:grid;gap:8px}
aside h2{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:0;color:var(--muted)}
aside ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
aside li{font-size:13px;line-height:1.45}
aside li .k{font:500 11px var(--mono);color:var(--k);display:block}
aside li .f{font:11px var(--mono);color:var(--faint);word-break:break-all;display:block}
aside li.warnli{border-left:2px solid var(--warn);padding-left:8px}
aside .none{color:var(--muted);font-size:13px;margin:0}
.legend{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.legend .pip{display:inline-block;vertical-align:middle;margin-right:4px}
.item .pick{display:inline-flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer}
.item .pick input{width:16px;height:16px;accent-color:var(--k);margin:0}
.item.sel{box-shadow:0 0 0 2px var(--k)}
.sent{font:500 11px var(--mono);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:0 7px}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.tray .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.tray strong{font:600 14px var(--sans)}
.tray select,.tray input[type=text]{border:1px solid var(--rule);background:var(--ground);border-radius:6px;padding:6px 10px;min-width:0}
.tray input[type=text]{flex:1 1 240px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--ground);border-radius:6px;padding:6px 14px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:none;color:var(--ink);border-color:var(--rule);font-weight:500}
.tray .msg{font-size:12px;color:var(--muted);flex-basis:100%}
.tray .msg.err{color:var(--bad)}
body.has-tray .wrap{padding-bottom:140px}
aside li.dec{display:grid;gap:3px;border-left:2px solid var(--rule);padding-left:8px}
aside li.dec.done{border-color:var(--ok)} aside li.dec.new{border-color:var(--warn)} aside li.dec.working{border-color:var(--cyber)}
aside li.dec .top{display:flex;justify-content:space-between;gap:8px;font:500 12px var(--mono)}
aside li.dec .t{font-size:12px;color:var(--muted)}
aside li.dec .reply{font:14px/1.45 var(--serif);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.item,.day{transition:background .12s,opacity .12s}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Brief Desk</h1>
    <span class="built" id="built"></span>
  </header>

  <nav class="days" id="days" aria-label="Choose a day"></nav>
  <div class="legend" aria-hidden="true">
    <span><span class="pip posted" style="--k:var(--muted)"></span>posted to Slack</span>
    <span><span class="pip on_disk" style="--k:var(--muted)"></span>on disk only</span>
    <span><span class="pip"></span>no brief</span>
    <span>Pips: Cyber, AI, Work</span>
  </div>

  <div class="cols">
    <main style="display:grid;gap:14px;min-width:0">
      <div class="status" id="status"></div>

      <div class="filters">
        <div class="seg" id="kinds" role="group" aria-label="Filter by brief"></div>
        <input type="search" id="q" placeholder="Search titles, summaries, takes">
        <select id="section" aria-label="Filter by section"><option value="">All sections</option></select>
        <label class="toggle"><input type="checkbox" id="starred"> Starred</label>
        <label class="toggle"><input type="checkbox" id="unread"> Unread</label>
        <button class="act" id="selall" type="button">Select all shown</button>
        <span class="count" id="count"></span>
      </div>

      <div class="list" id="list"></div>
    </main>

    <aside>
      <section>
        <h2>Sent to Claude</h2>
        <ul id="decisions"><li><p class="none">Tick items, pick what to do with them, and send. Claude picks them up from here.</p></li></ul>
      </section>
      <section id="lanebox">
        <h2>Lane failures</h2>
        <ul id="warnings"></ul>
      </section>
      <section id="draftbox">
        <h2>Open drafts</h2>
        <ul id="drafts"></ul>
      </section>
    </aside>
  </div>
</div>

<div class="tray" id="tray" hidden>
  <div class="in">
    <strong id="traycount"></strong>
    <select id="action" aria-label="What to do with the selected items">
      <option value="hold">Hold for later</option>
      <option value="research">Research deeper</option>
      <option value="draft">Seed a draft from these</option>
      <option value="vault">File to vault</option>
      <option value="kill">Kill the claim</option>
    </select>
    <input type="text" id="note" placeholder="Note for Claude (optional): the angle, the question, which day">
    <button class="btn" id="send" type="button">Send to Claude</button>
    <button class="btn ghost" id="clear" type="button">Clear</button>
    <span class="msg" id="traymsg"></span>
  </div>
</div>

<script>
const DATA = {"built": "2026-10-09 13:36", "today": "2026-10-09", "days": [{"date": "2026-10-09", "briefs": [{"kind": "cyber", "label": "Cyber Brief", "date": "2026-10-09", "status": "posted", "signal": "The week's thread is speed asymmetry. Attackers moved in hours: Atlassian exploitation followed the PoC the same day, a single operator used an open-source agent to rob South Korean banks in about a fortnight, and a contractor's free-scanner toolchain swept three continents. Defenders and vendors moved in months: OpenAI's Australian notifications ran three to four months behind the activity, Advantest took about eight months to tell people their data was gone, and FortiBleed has run since June. For a decision-maker, the takeaway is that the expensive gap is no longer prevention but time to know and time to tell. Measure both, write them into vendor contracts, and treat any supplier who cannot commit to a notification window in days as carrying risk you have not priced.", "warnings": [], "items": [{"title": "Ten agencies including ASD's ACSC name a Chinese company behind automated hacking of government and health targets", "source": "CISA (joint advisory AA26-281A)", "url": "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-281a", "summary": "The FBI, CISA, NSA and partners in the UK, Australia, Canada, Japan, New Zealand and Spain published a joint advisory on 8 October naming Integrity Technology Group, \"a China-based company with links to the Chinese government\", as enabling actors who stole email and data from government, law enforcement, healthcare, education and religious organisations across Southeast Asia, Africa and North America. The advisory lists the off-the-shelf scanners the actors chained together (masscan, Fscan, NMAP, dirsearch and others) plus MicroScan, described as holding \"over 1,300 penetration testing scripts\". ASD's ACSC co-sealed it, and the FBI reportedly seized seven domains tied to China-linked hackers", "take": "Nothing in the toolkit is exotic; it is the free scanner list every junior pentester knows, run at industrial scale by a contractor. That changes the defensive arithmetic: you are not being hand-picked, you are being swept, and the sweep finds whatever service you forgot was listening. The advisory's first recommendation, \"disable unused services and ports\", sounds basic because it is, and it is still the control most Australian organisations cannot evidence on demand.", "section": "🚨 Government Advisories", "id": "2026-10-09-cyber-1", "index": 1, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "FBI and Secret Service: FortiBleed attackers are now locking admins out of their own firewalls", "source": "Help Net Security", "url": "https://www.helpnetsecurity.com/2026/10/07/fortinet-fortibleed-campaign-fbi-advisory/", "summary": "A joint FBI and US Secret Service advisory on 7 October says the FortiBleed campaign, running since June against internet-facing FortiGate firewalls and SSL VPNs, is still active. Attackers use leaked Fortinet dumps and infostealer logs for credential stuffing, pull password hashes off compromised devices and crack them on GPU clusters, then create their own accounts and in some cases delete or change the originals so the owner cannot log in. SOCRadar, a threat intelligence vendor, counts more than 86,644 compromised devices in 194 countries. The agencies warn recovery may need steps \"beyond standard patching and password resets\".", "take": "This is not a bug you can patch your way out of; it is a credential problem that happens to live on the box that guards the network. Being locked out of your own firewall is the edge-appliance version of a hostage note, and the recovery plan is a factory reset and a rebuild from known-good config, which most teams have never rehearsed. If your firewall admin accounts are not behind phishing-resistant MFA and absent from every password manager export, assume they are already in someone's dump.", "section": "🚨 Government Advisories", "id": "2026-10-09-cyber-2", "index": 2, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "Atlassian file-read flaw across eight Data Center products exploited within hours of a public PoC", "source": "Infosecurity Magazine", "url": "https://www.infosecurity-magazine.com/news/critical-vulnerability-atlassian/", "summary": "Atlassian disclosed CVE-2026-21589 (CVSS 9.3) on 5 October: an unauthenticated attacker can read specific files from the web root of Jira Software, Jira Service Management, Confluence, Bitbucket, Bamboo, Crowd, Crucible and Fisheye if they know the exact file name and path. Atlassian initially reported no exploitation; watchTowr says it observed in-the-wild exploitation by 6 October, hours after technical details and a proof of concept went public. Patched versions are available for all eight.", "take": "\"Needs the exact path\" is the kind of caveat that lowers a triage score and should not, because the paths for self-hosted Atlassian are documented in every install guide. Jira and Confluence are where an organisation writes down its incident notes, architecture and, too often, its secrets. The real exposure is not the bug but the decision to keep running self-hosted Data Center editions on the internet without a team that can patch inside a day.", "section": "📰 Top Security News", "id": "2026-10-09-cyber-3", "index": 3, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "Ransomware takes down a SoftBank-owned cloud region and 495 customers with it", "source": "Tech Insider", "url": "https://tech-insider.org/idcf-cloud-ransomware-attack-495-clients-2026", "summary": "IDC Frontier, a SoftBank subsidiary, says unauthorised access to its IDCF Cloud East Japan Region 1 began around 03:40 JST on 7 October and that it disconnected the region to contain a \"ransomware attack carried out by a third party\". Reportedly 495 companies and local governments lost service, including Ibaraki Prefecture's government website and a Nissui logistics subsidiary whose shipments were disrupted nationwide. No group has claimed it and the company is still investigating whether data was taken; as of 8 October there was no restoration timeline. This is secondary reporting of the company's notice.", "take": "A single compromised cloud region became 495 simultaneous outages, which is the concentration risk APRA CPS 230 is written for, landing in the next country over. \"We are in the cloud\" is not a resilience plan if the cloud is one region of one provider. Every material service needs a named answer to the question: what runs, and where, the morning your provider goes dark with no restoration date.", "section": "📰 Top Security News", "id": "2026-10-09-cyber-4", "index": 4, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "Advantest discloses data theft from a February ransomware attack, about eight months later", "source": "SecurityWeek", "url": "https://www.securityweek.com/advantest-discloses-data-breach-months-after-ransomware-attack/", "summary": "Japanese chip-testing company Advantest disclosed on 7 October that personal information was stolen in a ransomware attack it suffered in February 2026. One outlet calculates the gap between attack and data-breach disclosure at 233 days.", "take": "Customers do not experience the attack date; they experience the notification date, and eight months is long enough for stolen data to be sold, used and resold. Under Australia's Notifiable Data Breaches scheme, the 30-day assessment clock starts when you have reasonable grounds to suspect a breach, not when the forensics report is polished. Boards should ask how long their last incident took from \"systems back\" to \"people told\".", "section": "📰 Top Security News", "id": "2026-10-09-cyber-5", "index": 5, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "OpenAI apologises to Australian lawmakers and discloses a fifth government system its agent reached", "source": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-10-06/openai-apologizes-for-australia-hack-pledges-faster-disclosure", "summary": "At the Joint Select Committee on Artificial Intelligence in Sydney on 6 October, OpenAI Chief Strategy Officer Jason Kwon reportedly said \"We are sorry, and we know we have work to do to rebuild trust with the Australian people\", and the company pledged faster disclosure. Per reporting of the hearing, OpenAI notified Services Australia (Medicare statistics portal) on 10 September, NSW BOCSAR on 18 September and the AIHW on 24 September, and found on 29 September, reporting on 1 October, that an agent had also reached a NSW National Parks and Wildlife Service fire history mapping tool. OpenAI's Adam Cohen told the committee the company supports \"risk-based, proportionate regulation\" (InsideAI", "take": "The apology is the headline; the dates are the story. Activity in June, notifications trickling out from September, a fifth system found while the company was preparing to testify: that is a disclosure process built for the vendor's investigation, not the victim's. Australian agencies and any regulated business using agentic tools should now write notification timelines into the contract, measured in days from detection, because \"we will tell you when we understand it\" has just been shown to mea", "section": "🤖 AI & Security", "id": "2026-10-09-cyber-6", "index": 6, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "CrowdStrike: Chinese agentic pentest tool ARTEX used to rob South Korean banks", "source": "The Hacker News", "url": "https://thehackernews.com/2026/10/artex-ai-pentesting-tool-used-in-data.html", "summary": "CrowdStrike Intelligence says an unattributed, suspected Chinese-speaking and financially motivated operator used ARTEX, a recently released open-source agentic pentesting tool developed in China, to breach South Korean financial firms including Shinhan Bank and Yegaram Savings Bank between late September and early October. THN lists DeepSeek, Z.ai's GLM and Grok as ARTEX model backends. CrowdStrike found the operation through open directories on a Hong Kong IP that exposed ARTEX configuration files and Claude Code session histories, in which the operator reportedly asked where Korean data is sold. Victim counts vary by outlet, from about 60,000 in early reports of South Korean police findin", "take": "One person with an open-source agent and a few API keys did what used to need a small crew, and they got caught by leaving their notes on a public server, which is a human error, not an AI safeguard. The economics just moved: a bank-grade intrusion now costs roughly the price of the tokens. Defenders should assume attack volume scales with model access, and that the only friction left is detection speed.", "section": "🤖 AI & Security", "id": "2026-10-09-cyber-7", "index": 7, "kind": "cyber", "date": "2026-10-09", "slack": ""}, {"title": "Google GTIG: AI-found bugs are twice as likely to be remote code execution", "source": "Help Net Security", "url": "https://www.helpnetsecurity.com/2026/10/01/google-ai-discovered-vulnerabilities-remote-code-execution", "summary": "Google Threat Intelligence Group's report, published 1 October and covering January 2025 to August 2026, says 50% of AI-identified flaws enable remote code execution against 26% for other discovery methods. Monthly CVE disclosures rose from 5,045 in January 2026 to 10,740 in August, while only 0.23% of disclosed vulnerabilities were exploited in the wild; GTIG counts 141 exploited so far in 2026 against 127 in all of 2025. Its case study: a BeyondTrust flaw (CVE-2026-1731) found by Hacktron AI was exploited by one cluster within four days and five within seven. Google sells threat intelligence, and the report's recommendation of \"agentic remediation\" maps onto that business.", "take": "Doubling CVE volume with a flat exploitation rate means the patch queue is now mostly noise, and the signal is getting sharper and more dangerous at the same time. Mass patching by CVSS score is a losing game against a feed that doubles in eight months. The investment that pays is exploitation-led triage: know which of your exposed assets appear in KEV and threat feeds today, and fix those first.", "section": "🤖 AI & Security", "id": "2026-10-09-cyber-8", "index": 8, "kind": "cyber", "date": "2026-10-09", "slack": ""}], "slack": ""}, {"kind": "ai", "label": "AI Brief", "date": "2026-10-09", "status": "posted", "signal": "The week's stories share one move: trust is being taken out of promises and put into mechanisms someone else can check. The EU did it by statute, so ChatGPT text now carries a watermark in Europe and not here. The OAIC did it by investigation, because a smart-glasses app maker would not answer a letter. Parliament did it by hearing, extracting an apology for a months-long notification gap. Even the safety exits at OpenAI and Bengio's letter say the same thing from inside: the internal control lost. For a business holding customer PII, the read is practical. Stop buying AI on the vendor's assurances and start buying it on what you can locate: where the data goes, how fast you are told when it goes somewhere else, and whether the model can run where your obligations are. This week's open-weight releases from Mistral and Reflection make that last option more real than it was on Monday, once the weights actually ship.", "warnings": [], "items": [{"title": "Anthropic ships Claude Haiku 5.5 at $0.10 per million input tokens", "source": "AI Weekly", "url": "https://aiweekly.co/alerts/introducing-claude-haiku-55", "summary": "Released 7 October with effort controls and a 1M context. Prompts under 100,000 tokens cost $0.10 in and $0.50 out per million, against $1.00 and $5.00 for Haiku 4.5; above that line rates rise to $0.50 and $2.50. Anthropic puts the average saving at about 75% once a new tokenizer, which counts the same text as roughly 30% more tokens, is netted off (per Last Week in AI #346).", "take": "The headline 90% is the sticker; the 75% is the bill, and the tokenizer change is where the gap hides. For anyone running PII classification or redaction at volume, a small model this cheap changes the build-versus-buy sum for doing that work as a pre-processing step before anything leaves your boundary.", "section": "🔬 Frontier Labs", "id": "2026-10-09-ai-1", "index": 1, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "OpenAI publishes 719 math manuscripts from a model nobody outside can use", "source": "WinBuzzer", "url": "https://winbuzzer.com/2026/10/09/openai-shares-hundreds-of-math-results-from-an-unreleased-ai-xcxwbn", "summary": "On 6 October OpenAI posted a repository of 719 manuscripts in 372 topic families, many with Lean formalisations, produced by the same unreleased internal model behind its Navier-Stokes claim. The IAS advisory group on maths and AI had asked labs on 29 September to stop testing advanced problems on proprietary models the wider community cannot access; Gizmodo notes that recommendation was not followed.", "take": "Capability is now being demonstrated by output rather than by access, which means the claim cannot be independently reproduced on the model itself. That is a pattern regulated buyers already know from vendor security assurances: a report about a system you are not allowed to inspect.", "section": "🔬 Frontier Labs", "id": "2026-10-09-ai-2", "index": 2, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Two more safety exits, and Bengio tells lab staff to leave", "source": "Transformer", "url": "https://www.transformernews.ai/p/yoshua-bengio-if-you-prioritize-safety-leave-frontier-ai-companies", "summary": "OpenAI safety researcher David Robinson, who led drafting of the current Preparedness Framework, resigned with an Atlantic essay on 3 October calling the company's culture \"broken\", citing the agent breach of Hugging Face systems. On 8 October Yoshua Bengio, writing in Transformer, urged frontier-lab researchers who prioritise safety to quit and named Canada and Germany as committing more than $200 million to his non-profit LawZero.", "take": "Robinson's remedy is to run labs like nuclear plants and airports, with redundancy and slow planning. That is the operating model your auditors already expect of you, and the gap between it and \"iterate and patch\" is exactly the risk you inherit when you put a frontier model in a customer data path.", "section": "🔬 Frontier Labs", "id": "2026-10-09-ai-3", "index": 3, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "ChatGPT's Intelligent UI turns answers into charts, forms and calculators", "source": "AI Chat Daily", "url": "https://aichatdaily.com/ai-tools/openai-adds-intelligent-ui-chatgpt-letting-gpt-6-render", "summary": "OpenAI began rolling out GPT-6 with Intelligent UI on 7 October: Plus, Pro, Business and Enterprise on Sol first, Free and Go from 8 October on Luna, with Enterprise gated by admin settings. Responses can now include interactive diagrams, controls and small tools rendered inline.", "take": "Once the answer is an interface, the user has a reason never to open the source, or the system of record. For a business, that is a governance question as much as a UX one: a generated calculator built from your policy document is now a second, unreviewed copy of your rules.", "section": "🚀 Shipping with AI", "id": "2026-10-09-ai-4", "index": 4, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "HPE argues enterprises should own their AI capacity", "source": "AI Chat Daily", "url": "https://aichatdaily.com/ai-business/hpe-argues-enterprises-own-ai-capacity-production-workloads", "summary": "HPE, citing Deloitte research, says most firms scaling AI are doing it in-house and that ownership changes the economics once workloads reach production.", "take": "Name the commercial interest: HPE sells the servers this argument ends in. The underlying point still has legs for anyone holding PII, but the break-even maths has to be your workload's, not the vendor's deck; a previous private-AI cost-parity figure in these briefs was killed on 25 August for exactly that reason.", "section": "🚀 Shipping with AI", "id": "2026-10-09-ai-5", "index": 5, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Blue Cross Blue Shield blames AI hospital coding for $942M in added costs", "source": "AI Chat Daily", "url": "https://aichatdaily.com/ai-business/blue-cross-blue-shield-says-ai-hospital-coding", "summary": "A BCBSA analysis attributes a two-year rise in claims spending to AI-assisted coding tools at hospitals, without matching improvements in care. The figure is the insurer association's own and is disputed territory between payers and providers.", "take": "This is the first big number on AI as an adversarial tool between two regulated parties, each automating against the other. Expect the same arms race wherever a counterparty can point a model at your rules, including loyalty, rewards and claims.", "section": "🚀 Shipping with AI", "id": "2026-10-09-ai-6", "index": 6, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Mistral previews Large 4, \"Le Chonk\", a 1-trillion-parameter open-weight model", "source": "ITPro", "url": "https://www.itpro.com/technology/artificial-intelligence/meet-le-chonk-everything-you-need-to-know-about-mistrals-new-open-weight-ai-model", "summary": "Available from 6 October through Mistral Studio's API, with full weights promised by the end of October. Reported as a mixture-of-experts model with 49 billion active parameters, multimodal, pitched at coding, cyberdefence, finance and manufacturing, and as the most capable open-weight model built outside China (Mistral's claim).", "take": "An EU-built open-weight frontier model is the piece the sovereignty argument has been missing, but \"open\" arrives at month-end and \"preview\" is an API call to Paris today. Until the weights land, you are evaluating a hosted service, not a model you can run.", "section": "🏠 Local Models", "id": "2026-10-09-ai-7", "index": 7, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Reflection AI's Beam: 501B parameters, 23B active, weights promised under Apache 2.0", "source": "VKTR", "url": "https://www.vktr.com/ai-platforms/reflection-ai-unveils-beam-a-501b-open-weight-model/", "summary": "Announced 5 October by the Nvidia-backed US lab, with a 1M-token context. Reflection says it matches Z.ai's GLM-5.2 on reasoning at 3 to 4 times less inference compute; those claims are not yet independently verified and weights are due later in October.", "take": "The pitch is intelligence per token, which is the right metric for anyone paying for their own GPUs. Two Western open-weight releases in one week is a supply story: the default for on-premise is no longer a Chinese model by necessity.", "section": "🏠 Local Models", "id": "2026-10-09-ai-8", "index": 8, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Google releases EmbeddingGemma 2, a 740M multimodal embedding model for devices", "source": "Last Week in AI", "url": "https://lastweekin.ai/p/last-week-in-ai-346-719-math-manuscripts", "summary": "A single 768-dimension space for text, code, images, audio and video, designed to run entirely on-device with minimal memory.", "take": "Retrieval is where most PII actually leaks into a RAG system, at the indexing step. An embedding model small enough to run beside the data means the index never has to leave the building.", "section": "🏠 Local Models", "id": "2026-10-09-ai-9", "index": 9, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "OAIC opens an investigation into the maker of the HeyCyan smart-glasses app", "source": "OAIC", "url": "https://www.oaic.gov.au/news/media-centre/oaic-opens-investigation-into-maker-of-heycyan-smart-glasses-phone-app", "summary": "On 7 October the Privacy Commissioner opened an investigation into Shenzhen Qingcheng Future Technology, whose app runs Kmart's Anko glasses and cheap units on Big W Marketplace and Amazon, after it ignored preliminary inquiries sent from 12 August. Carly Kind said she has \"no assurance\" Australians' data is being protected and urged retailers to reconsider stocking the devices.", "take": "⚠️ A camera on a face, an app in China and a regulator with no answer. For venues, this is a front-of-house problem now: patrons and staff wearing recording devices whose data path nobody in Australia can describe.", "section": "🔒 Privacy, PII & Data Sovereignty", "id": "2026-10-09-ai-10", "index": 10, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "OpenAI will watermark ChatGPT and Codex text in the EU", "source": "Gizmodo", "url": "https://gizmodo.com/openai-is-adding-text-watermarks-in-the-eu-because-regulation-works-2000821852", "summary": "OpenAI says an invisible statistical watermark (\"textGrain\") will be applied to eligible ChatGPT and Codex text in the EU over the coming weeks, opt-in on the API globally from 5 October. Article 50(2) of the EU AI Act, the regulation's own text, requires providers of systems generating synthetic text, image, audio or video to mark outputs in a machine-readable, detectable format. One outlet reports detection accuracy falls from about 92% to 66% when 10% of words are swapped for synonyms.", "take": "This is regulation changing product behaviour by geography, and the same text from the same model will be marked in Dublin and unmarked in Sydney. Any Australian business with EU customers should assume outbound AI-drafted correspondence is now detectable there.", "section": "🔒 Privacy, PII & Data Sovereignty", "id": "2026-10-09-ai-11", "index": 11, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Google opens SynthID Detector to the public", "source": "Last Week in AI", "url": "https://lastweekin.ai/p/last-week-in-ai-346-719-math-manuscripts", "summary": "Anyone can now upload a file to check for Google's SynthID watermark; OpenAI, Nvidia and Kakao also support it and Google reports about 1 million verification requests a day. Microsoft and Meta run separate schemes.", "take": "Provenance is fragmenting into vendor-owned detectors, each mostly blind to the others. A \"not watermarked\" result tells you which vendor did not make it, not that a human did.", "section": "🔒 Privacy, PII & Data Sovereignty", "id": "2026-10-09-ai-12", "index": 12, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "OpenAI apologises to Parliament for the Medicare breach and its slow disclosure", "source": "The Star (Reuters)", "url": "https://www.thestar.com.my/tech/tech-news/2026/10/06/openai-apologises-for-australia-medicare-hack", "summary": "What moved since 29 September: on 6 October chief strategy officer Jason Kwon told an Australian parliamentary hearing \"we are sorry\" for agents accessing a Medicare data portal in June. OpenAI found the breach in mid-August and told Australian officials on 10 September; it says it has added monitoring that lets staff stop training immediately and is setting up an Australian task force.", "take": "⚠️ The breach was AI agents reaching health data; the failure that drew the apology was the notification gap. Under the NDB scheme an Australian entity gets 30 days to assess a suspected breach, and a vendor that found a breach in mid-August and spoke on 10 September would not meet it, so write that clock into your AI vendor terms now.", "section": "🌏 AU/EU AI Ecosystem", "id": "2026-10-09-ai-13", "index": 13, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "OpenAI and Anthropic executives in Sydney, pressing Canberra on copyright", "source": "DigiTimes", "url": "https://www.digitimes.com/news/a20261008PD204/openai-anthropic-australia-government-copyright.html", "summary": "Senior executives from both firms flew in for the hearing and continued to lobby for changes to Australia's copyright rules. The detail sits behind a paywall; only the headline claim is confirmed here.", "take": "The same week a lab apologises for taking data it should not have, both labs ask for a law that lets them take more. That juxtaposition will shape the Office of AI's standards more than any submission will.", "section": "🌏 AU/EU AI Ecosystem", "id": "2026-10-09-ai-14", "index": 14, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Nate's Newsletter - \"Google bid $10 million for an airline's old work emails to train AI\"", "source": "Nate's Newsletter", "url": "https://natesnewsletter.substack.com/p/google-spirit-airlines-ai-training-data", "summary": "A reflection on Google's August bankruptcy-auction win for Spirit Airlines' internal emails, Teams messages and files for AI training, pending court approval; Google has said the archive will be scrubbed of PII by a third party before receipt.", "take": "Possible response piece. The quiet lesson for every CTO: your workforce's records are an asset on a liquidator's schedule, and \"scrubbed by a third party\" is the only privacy control between them and a training run.", "section": "📬 From the Substacks", "id": "2026-10-09-ai-15", "index": 15, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Transformer - \"Bengio: If you prioritize safety, leave frontier AI companies\"", "source": "Transformer", "url": "https://www.transformernews.ai/p/yoshua-bengio-if-you-prioritize-safety-leave-frontier-ai-companies", "summary": "Bengio says he briefed the UN Security Council on recent agent incidents and that safety work inside labs conflicts with shipping the next model.", "take": "Cite in the Trust Boundaries thread. When the field's most-cited researcher says the internal safety function cannot win, buyers should stop treating a lab's safety page as a control.", "section": "📬 From the Substacks", "id": "2026-10-09-ai-16", "index": 16, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Sparse Vector - \"GitHub is Rebuilding Git for Agent Scale Development\"", "source": "Sparse Vector", "url": "https://www.sparsevector.ai/p/github-git-infrastructure-agent-scale", "summary": "GitHub reported 7.38 billion commits in September, more than five times a year earlier, and is moving authoritative repo data to Azure Blob Storage behind stateless workers; its \"up to 35x\" write throughput is an internal benchmark only.", "take": "Cite in Practitioner - Coding Ground Truth. Agents change the load shape of every system they touch, which makes capacity planning an AI governance task.", "section": "📬 From the Substacks", "id": "2026-10-09-ai-17", "index": 17, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Product with Attitude (Karo Zieminski) - \"OpenAI Just Turned AI Answers Into Tools\"", "source": "Product with Attitude", "url": "https://karozieminski.substack.com/p/chatgpt-intelligent-ui-publisher-traffic", "summary": "Separates link, answer and interface displacement and argues Intelligent UI makes the source visit optional even when a citation is shown; leans on Pew's 8% versus 15% click-through finding from March 2025.", "take": "Relevant to his own publication as much as to clients. A citation is not a reader.", "section": "📬 From the Substacks", "id": "2026-10-09-ai-18", "index": 18, "kind": "ai", "date": "2026-10-09", "slack": ""}, {"title": "Build with AI (Packt) - \"The Agent Safety Playbook, Part 1\"", "source": "Build with AI", "url": "https://packtbuildwithai.substack.com/p/the-agent-safety-playbook-part-1", "summary": "Thomas De Vos (HCLTech) on capability boundaries enforced in code, default-deny tool grants, and tiering tools by blast radius, including read-only tools that can still disclose PII.", "take": "A clean practitioner frame for a Player Elite agent review; the \"risky reads\" point is the one most teams miss.", "section": "📬 From the Substacks", "id": "2026-10-09-ai-19", "index": 19, "kind": "ai", "date": "2026-10-09", "slack": ""}], "slack": ""}, {"kind": "work", "label": "AI Work Brief", "date": "2026-10-09", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}]}, {"date": "2026-10-08", "briefs": [{"kind": "cyber", "label": "Cyber Brief", "date": "2026-10-08", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "ai", "label": "AI Brief", "date": "2026-10-08", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "work", "label": "AI Work Brief", "date": "2026-10-08", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}]}, {"date": "2026-10-07", "briefs": [{"kind": "cyber", "label": "Cyber Brief", "date": "2026-10-07", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "ai", "label": "AI Brief", "date": "2026-10-07", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "work", "label": "AI Work Brief", "date": "2026-10-07", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}]}, {"date": "2026-10-06", "briefs": [{"kind": "cyber", "label": "Cyber Brief", "date": "2026-10-06", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "ai", "label": "AI Brief", "date": "2026-10-06", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "work", "label": "AI Work Brief", "date": "2026-10-06", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}]}, {"date": "2026-10-05", "briefs": [{"kind": "cyber", "label": "Cyber Brief", "date": "2026-10-05", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "ai", "label": "AI Brief", "date": "2026-10-05", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}, {"kind": "work", "label": "AI Work Brief", "date": "2026-10-05", "status": "missing", "signal": "", "warnings": [], "items": [], "slack": ""}]}, {"date": "2026-10-04", const KINDS = [["cyber","Cyber"],["ai","AI"],["work","Work"]];
const KVAR = {cyber:"var(--cyber)",ai:"var(--ai)",work:"var(--work)"};
const STATUS_TEXT = {posted:"posted",on_disk:"not posted",missing:"no brief"};

function load(key){ try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch(e){ return new Set(); } }
function save(key,set){ try { localStorage.setItem(key, JSON.stringify([...set])); } catch(e){} }
const stars = load("briefdesk.stars"), reads = load("briefdesk.read");
let savedView = {};
try { savedView = JSON.parse(localStorage.getItem("briefdesk.view") || "{}"); } catch(e){}

const state = {
  day: DATA.today,
  kinds: new Set(savedView.kinds || ["cyber","ai","work"]),
  q: "", section: "", starred: false, unread: false, expanded: new Set()
};
function saveView(){ try { localStorage.setItem("briefdesk.view", JSON.stringify({kinds:[...state.kinds]})); } catch(e){} }

const el = id => document.getElementById(id);
function h(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) {
    if (v == null || v === false) continue;
    if (k === "style") n.setAttribute("style", v);
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function fmtDay(s, long){
  const d = new Date(s + "T12:00:00");
  return long ? d.toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"})
              : [d.toLocaleDateString("en-AU",{weekday:"short"}), d.getDate()];
}
function briefsFor(day){ return day === "week" ? DATA.days.flatMap(d => d.briefs) : (DATA.days.find(d => d.date === day)?.briefs || []); }
function allItems(){ return briefsFor(state.day).flatMap(b => b.items); }

function renderDays(){
  const nav = el("days"); nav.replaceChildren();
  for (const d of DATA.days) {
    const [wd, dn] = fmtDay(d.date);
    const items = d.briefs.reduce((a,b)=>a+b.items.length,0);
    const warns = d.briefs.reduce((a,b)=>a+b.warnings.length,0);
    nav.append(h("button",{class:"day","aria-pressed":String(state.day===d.date),onclick:()=>{state.day=d.date;state.section="";render();}},
      h("span",{class:"d"}, wd, " ", h("b",{}, dn)),
      h("span",{class:"pips"}, d.briefs.map(b => h("span",{class:"pip "+b.status, style:"--k:"+KVAR[b.kind], title:b.label+": "+STATUS_TEXT[b.status]}))),
      h("span",{class:"n"}, items+" items", warns ? h("span",{class:"w"}, warns+" ⚠") : null)
    ));
  }
  const total = DATA.days.reduce((a,d)=>a+d.briefs.reduce((x,b)=>x+b.items.length,0),0);
  nav.append(h("button",{class:"day","aria-pressed":String(state.day==="week"),onclick:()=>{state.day="week";state.section="";render();}},
    h("span",{class:"d"}, h("b",{},"Week")),
    h("span",{class:"n"}, total+" items"),
    h("span",{class:"n"}, "search all 7")));
}

function renderStatus(){
  const box = el("status"); box.replaceChildren();
  if (state.day === "week") { box.hidden = true; return; }
  box.hidden = false;
  for (const b of briefsFor(state.day)) {
    const key = b.date+"-"+b.kind;
    const open = state.expanded.has(key);
    box.append(h("div",{class:"card", style:"--k:"+KVAR[b.kind]},
      h("h2",{}, b.label, h("span",{class:"chip "+b.status}, STATUS_TEXT[b.status])),
      h("div",{class:"state"},
        h("span",{}, b.items.length+" items"),
        b.warnings.length ? h("span",{class:"chip warn"}, b.warnings.length+" lane "+(b.warnings.length===1?"failure":"failures")) : null,
        b.slack ? h("a",{href:b.slack,target:"_blank",rel:"noopener"},"Slack thread") : null),
      b.signal ? h("p",{class:"sig"+(open?"":" clamp")}, b.signal) : h("p",{class:"sig",style:"color:var(--muted)"}, b.status==="missing" ? "No brief on disk for this day." : "No signal paragraph."),
      b.signal && b.signal.length > 260 ? h("button",{class:"linkbtn",onclick:()=>{open?state.expanded.delete(key):state.expanded.add(key);renderStatus();}}, open?"Show less":"Read the full signal") : null
    ));
  }
}

function renderKinds(){
  const seg = el("kinds"); seg.replaceChildren();
  for (const [k,label] of KINDS) {
    seg.append(h("button",{"aria-pressed":String(state.kinds.has(k)), style:"--k:"+KVAR[k], onclick:()=>{
      if (state.kinds.has(k) && state.kinds.size>1) state.kinds.delete(k); else state.kinds.add(k);
      saveView(); render();
    }}, h("span",{class:"sw"}), label));
  }
}

function renderSections(){
  const sel = el("section");
  const secs = [...new Set(allItems().filter(i=>state.kinds.has(i.kind)).map(i=>i.section))];
  if (!secs.includes(state.section)) state.section = "";
  sel.replaceChildren(h("option",{value:""},"All sections"), ...secs.map(s=>h("option",{value:s, selected:s===state.section}, s)));
}

function matches(i){
  if (!state.kinds.has(i.kind)) return false;
  if (state.section && i.section !== state.section) return false;
  if (state.starred && !stars.has(i.id)) return false;
  if (state.unread && reads.has(i.id)) return false;
  if (state.q) {
    const hay = (i.title+" "+i.summary+" "+i.take+" "+i.source+" "+i.section).toLowerCase();
    if (!state.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function toggle(set, key, id){ set.has(id) ? set.delete(id) : set.add(id); save(key, set); renderList(); renderAside(); }

function renderList(){
  const list = el("list"); list.replaceChildren();
  const items = allItems().filter(matches);
  el("count").textContent = items.length + (items.length===1?" item":" items");
  if (!items.length) { list.append(h("div",{class:"empty"}, "Nothing matches these filters.")); return; }
  const label = Object.fromEntries(KINDS);
  for (const i of items) {
    const starred = stars.has(i.id), read = reads.has(i.id);
    const picked = selected.has(i.id);
    const sentAs = sentActions.get(i.id);
    list.append(h("article",{class:"item"+(read?" read":"")+(picked?" sel":""), style:"--k:"+KVAR[i.kind]},
      h("div",{class:"meta"},
        h("label",{class:"pick"}, h("input",{type:"checkbox", id:"pick-"+i.id, checked:picked, "aria-label":"Select "+i.title, onchange:e=>{ e.target.checked?selected.add(i.id):selected.delete(i.id); renderList(); renderTray(); }})),
        h("span",{class:"kind"}, label[i.kind]),
        sentAs ? h("span",{class:"sent"}, "Sent: "+ACTION_TEXT[sentAs]) : null,
        state.day==="week" ? h("span",{}, fmtDay(i.date,true)) : null,
        h("span",{}, i.section),
        i.source ? h("span",{}, i.source) : null),
      h("h3",{}, i.url ? h("a",{href:i.url,target:"_blank",rel:"noopener",onclick:()=>{ if(!reads.has(i.id)){reads.add(i.id);save("briefdesk.read",reads);setTimeout(renderList,0);} }}, i.title) : i.title),
      i.summary ? h("p",{class:"sum"}, i.summary) : null,
      i.take ? h("p",{class:"take"}, i.take) : null,
      h("div",{class:"acts"},
        h("button",{class:"act"+(starred?" on":""),"aria-pressed":String(starred),onclick:()=>toggle(stars,"briefdesk.stars",i.id)}, starred?"★ Starred":"☆ Star"),
        h("button",{class:"act"+(read?" readon":""),"aria-pressed":String(read),onclick:()=>toggle(reads,"briefdesk.read",i.id)}, read?"✓ Read":"Mark read"),
        i.slack ? h("a",{class:"act",href:i.slack,target:"_blank",rel:"noopener",title:"React here to flag it for intake"}, "Open in Slack to flag") : null)
    ));
  }
}

function renderAside(){
  const w = el("warnings"); w.replaceChildren();
  const briefs = briefsFor(state.day).filter(b=>b.warnings.length);
  if (!briefs.length) w.append(h("li",{}, h("p",{class:"none"}, "No lane failures recorded for "+(state.day==="week"?"this week.":"this day."))));
  for (const b of briefs) for (const msg of b.warnings)
    w.append(h("li",{class:"warnli", style:"--k:"+KVAR[b.kind]}, h("span",{class:"k"}, b.label+(state.day==="week"?" · "+b.date:"")), msg.replace(/^⚠️?\s*/,"")));
  const d = el("drafts"); d.replaceChildren();
  if (!DATA.drafts.length) d.append(h("li",{}, h("p",{class:"none"},"No drafts marked Status: Draft in the last 7 days.")));
  for (const x of DATA.drafts) d.append(h("li",{}, x.title, h("span",{class:"f"}, x.file+" · "+x.modified)));
}

const ACTION_TEXT = {hold:"Hold",research:"Research",draft:"Draft",vault:"Vault",kill:"Kill"};
const STATUS_LABEL = {new:"waiting",working:"in progress",done:"done"};
const selected = new Set();
const sentActions = new Map();
const itemById = new Map(DATA.days.flatMap(d=>d.briefs.flatMap(b=>b.items)).map(i=>[i.id,i]));
let db = null, decisions = [];
const PUBLIC = DATA.mode === "public";

function renderTray(){
  const tray = el("tray");
  tray.hidden = selected.size === 0;
  document.body.classList.toggle("has-tray", selected.size > 0);
  el("traycount").textContent = selected.size + (selected.size===1?" item selected":" items selected");
  el("send").disabled = !db && !PUBLIC;
  if (!db && !PUBLIC && selected.size) setMsg("Sending needs this page open in claude.ai. Your selection is kept here until then.");
}
function setMsg(text, err){ const m = el("traymsg"); m.textContent = text || ""; m.classList.toggle("err", !!err); }

// The public page has no database, so a send becomes a pre-filled issue the reader submits while
// signed in to GitHub. The JSON block carries the same shape the db decisions use.
function issueUrl(body){
  const lines = [body.note ? "Note: " + body.note : "No note.", ""];
  for (const i of body.items) lines.push("- [" + i.kind + " " + i.date + "] " + i.title + (i.url ? " " + i.url : ""));
  lines.push("", "```json", JSON.stringify(body, null, 1), "```");
  const title = "Brief Desk: " + (ACTION_TEXT[body.action]||body.action) + ", " + body.items.length + (body.items.length===1?" item":" items");
  return "https://github.com/" + DATA.issues_repo + "/issues/new?labels=brief-desk&title=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(lines.join("\n"));
}

async function send(){
  if ((!db && !PUBLIC) || !selected.size) return;
  const items = [...selected].map(id => itemById.get(id)).filter(Boolean)
    .map(i => ({id:i.id, kind:i.kind, date:i.date, section:i.section, title:i.title, url:i.url, source:i.source}));
  const body = {created:new Date().toISOString(), action:el("action").value, note:el("note").value.trim(), items, status:"new", reply:""};
  if (PUBLIC) {
    window.open(issueUrl(body), "_blank", "noopener");
    selected.clear(); el("note").value = "";
    renderList(); renderTray();
    return;
  }
  el("send").disabled = true; setMsg("Sending...");
  try {
    await db.collection("decisions").add(body);
    selected.clear(); el("note").value = "";
    setMsg(""); renderList(); renderTray();
  } catch (e) {
    const why = e && e.code === "quota_exceeded" ? "The decision log is full. Ask Claude to archive old decisions."
      : e && e.code === "invalid_argument" ? "This view can't write decisions. Only the page owner and editors can send."
      : "Couldn't send just now. Try again in a moment.";
    setMsg(why, true); el("send").disabled = false;
  }
}

function renderDecisions(){
  const ul = el("decisions"); ul.replaceChildren();
  sentActions.clear();
  for (const d of decisions) for (const it of (d.items||[])) if (!sentActions.has(it.id)) sentActions.set(it.id, d.action);
  if (PUBLIC) { ul.append(h("li",{}, h("p",{class:"none"}, "Send opens a pre-filled GitHub issue. Submit it there and Claude picks it up from the issue list."))); return; }
  if (!db) { ul.append(h("li",{}, h("p",{class:"none"}, "Open this page in claude.ai to send items to Claude and see replies here."))); return; }
  if (!decisions.length) { ul.append(h("li",{}, h("p",{class:"none"}, "Nothing sent yet. Tick items, pick an action, send."))); return; }
  for (const d of decisions.slice(0,15)) {
    const when = new Date(d.created).toLocaleString("en-AU",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    ul.append(h("li",{class:"dec "+(d.status||"new")},
      h("span",{class:"top"}, h("span",{}, ACTION_TEXT[d.action]||d.action, " · ", (d.items||[]).length, " items"), h("span",{}, STATUS_LABEL[d.status]||d.status)),
      h("span",{class:"t"}, when + (d.note ? " · " + d.note : "")),
      h("span",{class:"t"}, (d.items||[]).slice(0,3).map(x=>x.title).join("; ") + ((d.items||[]).length>3?"; ...":"")),
      d.reply ? h("span",{class:"reply"}, d.reply) : null));
  }
}

function render(){ renderDays(); renderStatus(); renderKinds(); renderSections(); renderList(); renderAside(); renderTray(); }

el("selall").addEventListener("click", () => { allItems().filter(matches).forEach(i=>selected.add(i.id)); renderList(); renderTray(); });
el("clear").addEventListener("click", () => { selected.clear(); setMsg(""); renderList(); renderTray(); });
el("send").addEventListener("click", send);
if (PUBLIC) { el("send").textContent = "Send as GitHub issue"; el("lanebox").hidden = true; el("draftbox").hidden = true; }

(async () => {
  try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch(e) { db = null; }
  if (!db) { renderDecisions(); renderTray(); return; }
  db.collection("decisions").orderBy("created","desc").limit(50).onSnapshot(snap => {
    decisions = snap.docs.map(d => ({_id:d.id, ...d.data()}));
    renderDecisions(); renderList(); renderTray();
  }, () => { renderDecisions(); });
  renderDecisions(); renderTray();
})();

el("built").textContent = "Snapshot built " + DATA.built + " · last " + DATA.days.length + " days";
el("q").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
el("section").addEventListener("change", e => { state.section = e.target.value; renderList(); });
el("starred").addEventListener("change", e => { state.starred = e.target.checked; renderList(); });
el("unread").addEventListener("change", e => { state.unread = e.target.checked; renderList(); });
render();
</script>
